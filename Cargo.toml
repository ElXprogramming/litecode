[package]
name = "litecode"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight VS Code-inspired native code editor and smart auto-formatter for Arch Linux"
license = "MIT"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
